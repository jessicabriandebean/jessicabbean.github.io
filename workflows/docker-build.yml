name: Build Project Docker Images

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: [economic_indicators, kpi_recommender_system, portfolio_optimization, product_analytics]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f projects/${{ matrix.project }}/Dockerfile \
            -t portfolio/${{ matrix.project }}:latest \
            projects/${{ matrix.project }}
#adjust image naming (portfolio/...) to match Docker Hub or GHCR later
jobs:
  build-kpi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: pip install uv
      - name: Build KPI Docker Image
        run: docker build -f projects/kpi_recommender_system/Dockerfile projects/kpi_recommender_system -t kpi-app

  build-portfolio-optimization:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - name: Install uv
          run: pip install uv
        - name: Build Portfolio Optimization Docker Image
          run: docker build -f projects/portfolio_optimization/Dockerfile projects/portfolio_optimization -t portfolio-optimization